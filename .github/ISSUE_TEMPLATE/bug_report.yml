name: Bug report
description: Something does not work with the Anova Cooker integration.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Settings → Devices & services → Anova Cooker → the version on the card.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: cooker
    attributes:
      label: Cooker model and firmware
      description: The model sticker, and the firmware version the Anova app shows.
      placeholder: "Anova Precision Cooker (Bluetooth + Wi-Fi), firmware ver 6.1.1"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - Bluetooth
        - Local Wi-Fi
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: If your version offers Download diagnostics (Settings → Devices & services → Anova Cooker → ⋮), drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Debug logs around the problem
      description: Enable debug logging (Settings → Devices & services → Anova Cooker → ⋮), reproduce the problem and paste the log here. The integration never logs the Wi-Fi password, but check what you paste anyway.
      render: shell
