# B1 cook card (minimal) for the Anova Cooker integration
#
# Only what you use while cooking:
#   - one ring: tap = Start cook, hold = Stop
#   - the countdown in the ring
#   - the duration, shown only while idle
#   - the low-water warning, shown only while it is actually on
#
# Required HACS frontend cards: mushroom, button-card
#
# Entity ids used (adjust if yours differ):
#   number.anova_cooker_cook_duration
#   sensor.anova_cooker_timer_remaining
#   sensor.anova_cooker_status
#   binary_sensor.anova_cooker_low_water
#   button.anova_cooker_start_cook
#   button.anova_cooker_silence_alarm
#   climate.anova_cooker

type: vertical-stack
cards:
  # countdown ring: tap to start, hold to stop
  - type: custom:button-card
    entity: sensor.anova_cooker_timer_remaining
    name: Cook
    show_name: false
    show_icon: false
    show_state: false
    show_label: true
    size: 100%
    label: >
      [[[
        const cooking = states['sensor.anova_cooker_status'].state === 'cooking';
        const rem = Number(states['sensor.anova_cooker_timer_remaining'].state) || 0;
        return cooking ? rem + ' min' : 'Start';
      ]]]
    tap_action:
      action: perform-action
      perform_action: button.press
      target:
        entity_id: button.anova_cooker_start_cook
    hold_action:
      action: perform-action
      perform_action: climate.set_hvac_mode
      target:
        entity_id: climate.anova_cooker
      data:
        hvac_mode: "off"
    styles:
      card:
        - border-radius: 50%
        - width: 150px
        - height: 150px
        - margin: 0 auto
        - background: >
            [[[
              const cooking = states['sensor.anova_cooker_status'].state === 'cooking';
              const rem = Number(states['sensor.anova_cooker_timer_remaining'].state) || 0;
              const total = Number(states['number.anova_cooker_cook_duration'].state) || 1;
              const pct = cooking && total ? Math.max(0, Math.min(100, (rem / total) * 100)) : 0;
              return `conic-gradient(var(--primary-color) ${pct}%, var(--secondary-background-color) ${pct}% 100%)`;
            ]]]
      label:
        - font-size: 20px
        - font-weight: 600
        - color: var(--primary-text-color)

  # duration, only while idle
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.anova_cooker_status
        state: idle
    card:
      type: custom:mushroom-number-card
      entity: number.anova_cooker_cook_duration
      name: Duration
      icon: mdi:timer-outline
      display_mode: buttons
      layout: horizontal

  # low-water warning, only while the alarm is on; tap to silence
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.anova_cooker_low_water
        state: "on"
    card:
      type: custom:mushroom-template-card
      entity: binary_sensor.anova_cooker_low_water
      icon: mdi:water-alert
      icon_color: orange
      primary: Low water
      secondary: Add water above the minimum mark, then start again.
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.anova_cooker_silence_alarm
