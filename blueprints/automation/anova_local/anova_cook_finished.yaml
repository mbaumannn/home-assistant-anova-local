blueprint:
  name: Anova timer stopped
  description: >
    Notifies when the Anova timer stops. On firmware 6.1.1 the cooker reports
    the same state whether the timer ran out (cook finished) or the timer was
    stopped early (cancelled): `read timer` returns `0 stopped` in both cases
    and the timer switch goes from on to off. Expiry and cancellation can
    therefore not be told apart from the entities, so this automation fires on
    either. A lost connection does not fire.
  domain: automation
  input:
    timer_switch:
      name: Anova timer switch
      selector:
        entity:
          domain: switch
    remaining_sensor:
      name: Anova timer remaining
      selector:
        entity:
          domain: sensor
    notify_target:
      name: Notify target
      selector:
        target:
          entity:
            domain: notify

variables:
  remaining_entity: !input remaining_sensor
  timer_entity: !input timer_switch

trigger:
  - platform: state
    entity_id: !input timer_switch
    from: "on"
    to: "off"

condition:
  # A lost connection is not a finished timer: both entities must be available.
  - condition: template
    value_template: "{{ states(timer_entity) not in ['unknown', 'unavailable'] }}"
  - condition: template
    value_template: "{{ states(remaining_entity) not in ['unknown', 'unavailable'] }}"

action:
  - action: notify.send_message
    target: !input notify_target
    data:
      title: "Anova"
      message: "Sous-vide timer stopped."

mode: single
