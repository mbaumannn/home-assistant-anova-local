blueprint:
  name: Anova reached temperature
  description: >
    Notifies when the water reaches the target temperature during a cook. The
    notification is only sent while the cooker is actively heating and both
    temperatures are valid numbers.
  domain: automation
  input:
    climate_entity:
      name: Anova climate
      selector:
        entity:
          domain: climate
    notify_target:
      name: Notify target
      selector:
        target:
          entity:
            domain: notify

# Trigger templates are evaluated before the automation variables are set, so
# the selected climate entity is exposed to the trigger via trigger_variables.
trigger_variables:
  anova: !input climate_entity

trigger:
  - platform: template
    value_template: >
      {% set target = state_attr(anova, 'temperature') | float(none) %}
      {% set current = state_attr(anova, 'current_temperature') | float(none) %}
      {{ states(anova) == 'heat'
         and target is not none
         and current is not none
         and current >= target }}

action:
  - action: notify.send_message
    target: !input notify_target
    data:
      title: "Anova"
      message: "Water has reached the target temperature."

mode: single
