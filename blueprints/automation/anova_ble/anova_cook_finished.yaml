blueprint:
  name: Anova cook finished
  description: >
    Notifies when the Anova timer runs out, meaning the cook is done. If the
    timer is stopped while time remains, it is treated as a cancellation and no
    notification is sent.
  domain: automation
  input:
    timer_switch:
      name: Anova timer switch
      selector:
        entity:
          domain: switch
    remaining_sensor:
      name: Anova timer remaining
      selector:
        entity:
          domain: sensor
    notify_target:
      name: Notify target
      selector:
        target:
          entity:
            domain: notify

variables:
  remaining_entity: !input remaining_sensor

trigger:
  - platform: state
    entity_id: !input timer_switch
    from: "on"
    to: "off"

condition:
  - condition: template
    value_template: "{{ states(remaining_entity) | int(999) <= 1 }}"

action:
  - action: notify.send_message
    target: !input notify_target
    data:
      title: "Anova"
      message: "Sous-vide is done."

mode: single
